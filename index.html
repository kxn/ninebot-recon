<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>九号出行 · 骑行数据看板</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --bg:#0d1117; --bg2:#161b22; --bg3:#1c2330; --bd:#2d333b;
  --fg:#e6edf3; --dim:#8b949e; --acc:#58a6ff; --acc2:#3fb950;
  --warn:#d29922; --red:#f85149;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,sans-serif;padding:16px}
a{color:var(--acc);text-decoration:none}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;margin-bottom:16px}
header h1{font-size:20px;font-weight:700}
header .sub{color:var(--dim);font-size:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.card{background:var(--bg2);border:1px solid var(--bd);border-radius:10px;padding:12px 14px}
.card .k{color:var(--dim);font-size:12px}
.card .v{font-size:22px;font-weight:700;margin-top:2px}
.card .v small{font-size:12px;color:var(--dim);font-weight:400}
.acc{color:var(--acc)}.grn{color:var(--acc2)}.warn{color:var(--warn)}.red{color:var(--red)}
.panel{background:var(--bg2);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:16px}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.filters label{color:var(--dim);font-size:12px}
select,input[type=month],input[type=text]{
  background:var(--bg3);color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:5px 8px;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{cursor:pointer;color:var(--dim);user-select:none;position:sticky;top:0;background:var(--bg2)}
th:hover{color:var(--fg)}
tbody tr:hover{background:var(--bg3)}
tr.detail-row>td{background:var(--bg3);padding:0}
.detail-box{padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.detail-box .map{height:280px;background:#10151c;border:1px solid var(--bd);border-radius:8px;min-height:280px}
.detail-box .info{font-size:13px;color:var(--dim)}
.detail-box .info b{color:var(--fg)}
canvas.speed{width:100%;height:120px;background:#10151c;border:1px solid var(--bd);border-radius:8px;margin-top:8px}
.chart-wrap{position:relative;height:180px}
#monthChart{width:100%;height:100%}
.empty{color:var(--dim);text-align:center;padding:30px}
.badge{display:inline-block;background:var(--bg3);border:1px solid var(--bd);border-radius:20px;padding:0 10px;font-size:12px;margin:2px 2px 0 0}
#toast{position:fixed;bottom:16px;right:16px;background:#f85149;color:#fff;padding:10px 14px;border-radius:8px;display:none;font-size:13px;z-index:999}
@media(max-width:720px){.detail-box{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header>
  <h1>🦐 九号出行 · 骑行数据看板</h1>
  <span class="sub" id="sub">加载中…</span>
</header>

<div class="stats" id="stats"></div>

<div class="panel chart-wrap">
  <div style="color:var(--dim);font-size:12px;margin-bottom:6px">月度骑行里程 (km) <span style="float:right" id="chartHint"></span></div>
  <canvas id="monthChart"></canvas>
</div>

<div class="panel">
  <div class="filters">
    <label>车辆</label><select id="fVehicle"><option value="">全部</option></select>
    <label>起始</label><input type="month" id="fFrom">
    <label>结束</label><input type="month" id="fTo">
    <label>搜索</label><input type="text" id="fSearch" placeholder="日期/ID 关键字" style="width:180px">
    <label style="margin-left:auto"><input type="checkbox" id="fOnlyDetail" checked> 只显示有数据的</label>
  </div>
</div>

<div class="panel" style="padding:0;overflow-x:auto">
  <table id="tbl">
    <thead><tr>
      <th data-k="start_time">时间</th>
      <th data-k="vehicle_name">车辆</th>
      <th data-k="distance_km">里程 km</th>
      <th data-k="duration_s">时长</th>
      <th data-k="max_speed_kmh">最高速 km/h</th>
      <th data-k="avg_speed_kmh">平均速 km/h</th>
      <th data-k="battery_used_pct">耗电 %</th>
      <th></th>
    </tr></thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="empty" id="empty" style="display:none">没有匹配的行程</div>
</div>

<div id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
"use strict";
let DATA = null, SORT = {k:'start_time', dir:-1};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDur = s => { s = +s || 0; const h = Math.floor(s/3600), m = Math.floor(s%3600/60); return h? `${h}h${String(m).padStart(2,'0')}m` : `${m}m`; };
const fmtDT = t => { if (!t) return '—'; const s = String(t); return s.length>=16 ? s.slice(0,16).replace('T',' ') : s; };

function toast(msg){ const el=$('#toast'); el.textContent=msg; el.style.display='block'; clearTimeout(el._t); el._t=setTimeout(()=>el.style.display='none',4000); }

function load(){
  fetch('trips.json', {cache:'no-store'}).then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(d => {
      DATA=d;
      if(d.stats && d.stats.demo){
        const b=document.createElement('div');
        b.style.cssText='background:#d29922;color:#0d1117;padding:6px 12px;border-radius:8px;margin-bottom:12px;font-weight:600';
        b.textContent='⚠ 当前展示的是示例数据（trips.json 带 demo 标记）。运行 python3 fetch_trips.py 生成真实数据后刷新即可。';
        document.body.insertBefore(b, document.body.firstChild);
      }
      render();
    })
    .catch(e => { $('#empty').style.display='block'; $('#empty').textContent = '无法加载 trips.json：'+e.message+'（请先运行 python3 fetch_trips.py）'; toast('trips.json 加载失败'); });
}

function monthKey(t){ if(!t) return ''; const s=String(t); return s.slice(0,7); }

function render(){
  const rides = DATA.rides || [];
  $('#sub').textContent = `共 ${rides.length} 条行程 · 数据生成于 ${(DATA.stats&&DATA.stats.generated_at||'').replace('T',' ')}`;

  // 车辆筛选
  const vs = [...new Set(rides.map(r=>r.sn||'')).values()].sort();
  const sel=$('#fVehicle'); sel.innerHTML='<option value="">全部</option>'+vs.map(v=>`<option>${esc(v)}</option>`).join('');
  vs.forEach(v=>{ if(v===sel.dataset.keep) sel.value=v; });

  // 月份范围
  const months = [...new Set(rides.map(r=>monthKey(r.start_time)).filter(Boolean))].sort();
  if(months.length){ $('#fFrom').value = months[0]; $('#fTo').value = months[months.length-1]; }

  renderStats(rides);
  renderChart(rides);
  renderTable(rides);
}

function renderStats(rides){
  const s = DATA.stats || {};
  const n = rides.length;
  const dist = rides.filter(r=>r.distance_km);
  const dur = rides.reduce((a,r)=>a+(+r.duration_s||0),0);
  const mx = rides.filter(r=>r.max_speed_kmh).map(r=>r.max_speed_kmh);
  const avgSp = dist.length ? dist.reduce((a,r)=>a+r.distance_km,0)/(dur/3600||1) : 0;
  const bestAvg = Math.max(0, ...rides.filter(r=>r.avg_speed_kmh).map(r=>r.avg_speed_kmh));
  const cards = [
    ['骑行次数', n, '', ''],
    ['总里程', (s.total_distance_km ?? dist.reduce((a,r)=>a+r.distance_km,0)).toFixed(1), 'km', 'acc'],
    ['总时长', fmtDur(dur), '', ''],
    ['历史最高速', (mx.length?Math.max(...mx):(s.overall_max_speed_kmh||0)).toFixed(1), 'km/h', 'red'],
    ['整体平均速', avgSp.toFixed(1), 'km/h', 'grn'],
    ['单次最佳均速', bestAvg.toFixed(1), 'km/h', 'grn'],
  ];
  $('#stats').innerHTML = cards.map(c=>`<div class="card"><div class="k">${c[0]}</div><div class="v ${c[3]}">${c[1]} <small>${c[2]}</small></div></div>`).join('');
}

function renderChart(rides){
  const cv=$('#monthChart'), ctx=cv.getContext('2d');
  const dpr=devicePixelRatio||1;
  const W=cv.clientWidth||800, H=cv.clientHeight||180;
  cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  const by={};
  rides.forEach(r=>{ if(r.distance_km){ const m=monthKey(r.start_time); by[m]=(by[m]||0)+r.distance_km; } });
  const months=Object.keys(by).sort();
  if(!months.length){ $('#chartHint').textContent='暂无数据'; return; }
  const max=Math.max(...Object.values(by));
  const padL=40,padR=8,padT=10,padB=22, cw=(W-padL-padR)/months.length;
  ctx.font='10px sans-serif';
  // 网格线
  ctx.strokeStyle='#2d333b'; ctx.fillStyle='#8b949e';
  for(let i=0;i<=3;i++){ const y=padT+(H-padT-padB)*i/3; ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke(); ctx.fillText((max*(1-i/3)).toFixed(0), 6, y+3); }
  months.forEach((m,i)=>{
    const v=by[m], h=(H-padT-padB)*v/max;
    const x=padL+i*cw+cw*0.18, w=cw*0.64, y=H-padB-h;
    ctx.fillStyle = v===max ? '#f85149' : '#58a6ff';
    ctx.beginPath(); ctx.roundRect(x,y,w,h,[2,2,0,0]); ctx.fill();
    if(i%2===0||months.length<14){ ctx.fillStyle='#8b949e'; ctx.fillText(m.slice(2), x-8, H-6); }
  });
  $('#chartHint').textContent = `${months.length} 个月 · 峰值 ${max.toFixed(1)} km`;
}

function filtered(){
  const v=$('#fVehicle').value, from=$('#fFrom').value, to=$('#fTo').value, q=($('#fSearch').value||'').toLowerCase();
  return (DATA.rides||[]).filter(r=>{
    if(v && r.sn!==v) return false;
    const mk=monthKey(r.start_time);
    if(from && mk<from) return false;
    if(to && mk>to) return false;
    if(q && !(JSON.stringify([r.start_time,r.travel_id,r.vehicle_name,r.sn]).toLowerCase().includes(q))) return false;
    if($('#fOnlyDetail').checked && r.distance_km==null && r.max_speed_kmh==null) return false;
    return true;
  });
}

function renderTable(){
  const rows = filtered();
  rows.sort((a,b)=>{ const av=a[SORT.k], bv=b[SORT.k]; if(av==null)return 1; if(bv==null)return -1; return (av<bv?-1:av>bv?1:0)*SORT.dir; });
  const tb=$('#tbody'); tb.innerHTML='';
  $('#empty').style.display = rows.length?'none':'block';
  rows.forEach((r,i)=>{
    const tr=document.createElement('tr');
    tr.innerHTML = `<td>${esc(fmtDT(r.start_time))}</td>
      <td>${esc(r.vehicle_name||r.sn||'—')}</td>
      <td>${r.distance_km!=null?+r.distance_km.toFixed(1):'—'}</td>
      <td>${r.duration_s?fmtDur(r.duration_s):'—'}</td>
      <td class="${r.max_speed_kmh>=40?'red':r.max_speed_kmh>=25?'warn':''}">${r.max_speed_kmh!=null?+r.max_speed_kmh.toFixed(1):'—'}</td>
      <td class="grn">${r.avg_speed_kmh!=null?+r.avg_speed_kmh.toFixed(1):'—'}</td>
      <td>${r.battery_used_pct!=null?r.battery_used_pct:'—'}</td>
      <td><span class="badge" style="cursor:pointer">${r.track||r.speed_samples||r.detail?'详情':'空'}</span></td>`;
    tr.onclick = ()=> toggleDetail(tr, r);
    tb.appendChild(tr);
  });
  updateTh();
}

function updateTh(){
  document.querySelectorAll('#tbl th').forEach(th=>{
    const k=th.dataset.k; if(!k)return;
    th.textContent = th.textContent.replace(/ [▲▼]$/,'');
    if(k===SORT.k) th.textContent += SORT.dir>0?' ▲':' ▼';
  });
}
document.querySelectorAll('#tbl th').forEach(th=>{ th.onclick=()=>{ const k=th.dataset.k; if(!k)return; if(SORT.k===k)SORT.dir*=-1; else {SORT.k=k;SORT.dir=-1;} renderTable(); }; });

function toggleDetail(tr, r){
  const next = tr.nextElementSibling;
  if(next && next.classList.contains('detail-row')){ next.remove(); return; }
  const row=document.createElement('tr'); row.className='detail-row';
  const hasTrack = Array.isArray(r.track)&&r.track.length;
  const hasSpeed = Array.isArray(r.speed_samples)&&r.speed_samples.length;
  row.innerHTML = `<td colspan="8"><div class="detail-box">
    <div><div class="map" id="map_${r.travel_id||'x'}"></div>
      <canvas class="speed" id="spd_${r.travel_id||'x'}" style="display:${hasSpeed?'block':'none'}"></canvas></div>
    <div class="info">
      <b>行程 ${esc(r.travel_id||'—')}</b><br>
      起：${esc(fmtDT(r.start_time))}<br>止：${esc(fmtDT(r.end_time))}<br>
      里程：<b>${r.distance_km!=null?+r.distance_km.toFixed(2):'—'}</b> km　时长：<b>${r.duration_s?fmtDur(r.duration_s):'—'}</b><br>
      最高速：<b class="${r.max_speed_kmh>=40?'red':''}">${r.max_speed_kmh!=null?+r.max_speed_kmh.toFixed(1):'—'}</b> km/h　平均速：<b class="grn">${r.avg_speed_kmh!=null?+r.avg_speed_kmh.toFixed(1):'—'}</b> km/h<br>
      耗电：${r.battery_used_pct!=null?r.battery_used_pct+'%':'—'}${r.speed_samples?`　采样点：${r.speed_samples.length}`:''}
      ${!hasTrack&&!hasSpeed?'<div style="color:var(--dim);margin-top:8px">（该行程没有轨迹/速度采样数据）</div>':''}
    </div>
  </div></td>`;
  tr.after(row);
  if(hasSpeed) drawSpeed(`spd_${r.travel_id||'x'}`, r.speed_samples);
  if(hasTrack) drawMap(`map_${r.travel_id||'x'}`, r.track);
  else { const el=document.getElementById(`map_${r.travel_id||'x'}`); if(el) el.style.display='none'; }
}

function drawSpeed(id, samples){
  const cv=document.getElementById(id); if(!cv) return;
  const dpr=devicePixelRatio||1, W=cv.clientWidth||600, H=cv.clientHeight||120;
  cv.width=W*dpr; cv.height=H*dpr; const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  const max=Math.max(...samples)*1.1||1, padL=30,padB=18,padT=6,padR=6;
  const n=samples.length, cw=(W-padL-padR)/(n-1||1);
  ctx.font='9px sans-serif'; ctx.strokeStyle='#2d333b'; ctx.fillStyle='#8b949e';
  for(let i=0;i<=3;i++){ const y=padT+(H-padT-padB)*i/3; ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke(); ctx.fillText((max*(1-i/3)).toFixed(0),4,y+3); }
  ctx.beginPath();
  samples.forEach((s,i)=>{ const x=padL+i*cw, y=H-padB-(H-padT-padB)*s/max; i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
  ctx.strokeStyle='#3fb950'; ctx.lineWidth=1.5; ctx.stroke();
  ctx.fillStyle='#8b949e'; ctx.fillText('速度 km/h', padL, 10);
}

function drawMap(id, track){
  const el=document.getElementById(id); if(!el) return;
  const pts = track.map(p=>{
    if(Array.isArray(p)) return [p[0], p[1]];                 // [lat, lon]
    if(p.lat!=null&&p.lng!=null) return [p.lat, p.lng];
    if(p.lat!=null&&p.lon!=null) return [p.lat, p.lon];
    if(p.latitude!=null&&p.longitude!=null) return [p.latitude, p.longitude];
    if(p.x!=null&&p.y!=null) return [p.y, p.x];
    return null;
  }).filter(Boolean);
  if(!pts.length){ el.style.display='none'; return; }
  if(window.L){
    const map=L.map(el,{zoomControl:true, attributionControl:false}).setView(pts[0], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
    L.polyline(pts,{color:'#58a6ff',weight:4,opacity:.85}).addTo(map);
    L.circleMarker(pts[0],{radius:5,color:'#3fb950'}).addTo(map);
    L.circleMarker(pts[pts.length-1],{radius:5,color:'#f85149'}).addTo(map);
    setTimeout(()=>map.invalidateSize(),50);
  } else {
    // 离线降级：Canvas 平面投影
    const dpr=devicePixelRatio||1, W=el.clientWidth||400, H=el.clientHeight||280;
    el.innerHTML=''; const cv=document.createElement('canvas');
    cv.width=W*dpr; cv.height=H*dpr; cv.style.cssText=`width:100%;height:100%`;
    el.appendChild(cv); const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
    const lats=pts.map(p=>p[0]), lons=pts.map(p=>p[1]);
    const minLat=Math.min(...lats),maxLat=Math.max(...lats),minLon=Math.min(...lons),maxLon=Math.max(...lons);
    const pad=20, sx=(maxLon-minLon)||1e-6, sy=(maxLat-minLat)||1e-6;
    const scale=Math.min((W-2*pad)/sx,(H-2*pad)/sy);
    ctx.strokeStyle='#58a6ff'; ctx.lineWidth=2.5; ctx.beginPath();
    pts.forEach((p,i)=>{ const x=pad+(p[1]-minLon)*scale, y=H-pad-(p[0]-minLat)*scale; i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
    ctx.stroke();
    ctx.fillStyle='#8b949e'; ctx.font='10px sans-serif'; ctx.fillText('离线轨迹（未加载 Leaflet 地图）', 8, 14);
  }
}

['fVehicle','fFrom','fTo','fSearch','fOnlyDetail'].forEach(id=>{ document.getElementById(id).addEventListener('input', renderTable); });
load();
</script>
</body>
</html>
